name: Verify a2b website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify site and security baseline
        run: npm run verify

      - name: Verify architecture map
        run: npm run architecture:check

      - name: Generate and validate Markdown layer
        run: |
          npm run markdown:generate
          git diff --exit-code -- markdown-routes.mjs data/markdown-companions.json
          npm run markdown:check
          npm run markdown:validate

      - name: Verify agent concierge safeguards
        run: npm run agent:concierge:test
